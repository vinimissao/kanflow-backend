# PostgreSQL local: utilizador postgres, base de dados kanflow (Flyway aplica as migrações).
# Se 28P01: confirma no pgAdmin a senha do utilizador postgres ou sobrescreve em config/application.yml.
spring:
  application:
    name: kanflow-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/kanflow
    username: postgres
    password: 12345678
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

# Se der "Port ... was already in use", muda o número ou define: set SERVER_PORT=9090
server:
  port: ${SERVER_PORT:9090}

security:
  jwt:
    # Para dev: sobrescreva via env var JWT_SECRET (ex.: set JWT_SECRET=...).
    secret: ${JWT_SECRET:dev-only-change-me-dev-only-change-me}
    access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:3600}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
    default-models-expand-depth: 2
  show-actuator: false
